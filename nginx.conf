server {
    listen 8443;
    server_name scott-site.ldev.shadowtechllc.net;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;

    location ~ (^|/)\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
